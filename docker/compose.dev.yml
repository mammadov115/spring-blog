services:
  db:
    container_name: blog-db-dev
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d blog"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    container_name: blog-nginx-dev
    image: nginx:alpine
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ../nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - BACKEND_HOST=${BACKEND_HOST}
      - BACKEND_PORT=${BACKEND_PORT}

volumes:
  postgres_data_dev:
