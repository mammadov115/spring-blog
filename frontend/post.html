<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Blog - Post Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body x-data="postDetail()">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Spring Blog</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Posts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="search.html">Search</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                
                <div class="mb-3">
                    <a href="index.html" class="text-decoration-none text-secondary">&larr; Back to Posts</a>
                </div>

                <!-- Global Error Alert -->
                <template x-if="error">
                    <div class="alert alert-danger" role="alert" x-text="error"></div>
                </template>

                <!-- Loading Spinner -->
                <div x-show="loading" class="spinner-container">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading post...</span>
                    </div>
                </div>

                <!-- Post Detail Card -->
                <template x-if="!loading && post">
                    <div>
                        <article class="card shadow-sm border-0 mb-4">
                            <div class="card-body p-4 p-md-5">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <h1 class="h2 fw-bold text-dark mb-0" x-text="post.title"></h1>
                                    <button class="btn btn-outline-primary btn-sm ms-2" data-bs-toggle="modal" data-bs-target="#shareModal">
                                        Share Post
                                    </button>
                                </div>

                                <div class="text-muted small mb-4 pb-3 border-bottom d-flex flex-wrap align-items-center gap-3">
                                    <span>By <strong x-text="post.authorName || 'Anonymous'"></strong></span>
                                    <span>•</span>
                                    <span x-text="formatDate(post.publish)"></span>
                                    <template x-if="post.status">
                                        <span class="badge bg-info text-dark ms-auto" x-text="post.status"></span>
                                    </template>
                                </div>

                                <div class="post-content fs-5 text-secondary mb-4" style="line-height: 1.7; whitespace: pre-line;" x-text="post.body"></div>

                                <div class="d-flex flex-wrap gap-2 pt-3 border-top">
                                    <strong class="me-2 align-self-center text-muted">Tags:</strong>
                                    <template x-for="tag in post.tags" :key="tag">
                                        <a :href="'index.html?tag=' + encodeURIComponent(tag)" class="badge bg-secondary text-decoration-none tag-badge" x-text="'#' + tag"></a>
                                    </template>
                                </div>
                            </div>
                        </article>

                        <!-- Similar Posts Section -->
                        <section class="mb-5" x-show="similarPosts && similarPosts.length > 0">
                            <h3 class="h4 fw-bold mb-3">Similar Posts</h3>
                            <div class="row g-3">
                                <template x-for="similar in similarPosts" :key="similar.id">
                                    <div class="col-md-6">
                                        <div class="card h-100 shadow-sm border-0 post-card">
                                            <div class="card-body">
                                                <h5 class="card-title h6 fw-bold">
                                                    <a :href="'post.html?slug=' + similar.slug" class="text-decoration-none text-dark" x-text="similar.title"></a>
                                                </h5>
                                                <p class="card-text text-muted small" x-text="truncateText(similar.body, 90)"></p>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </section>

                        <!-- Comments Section -->
                        <section class="mb-5">
                            <h3 class="h4 fw-bold mb-4">Comments (<span x-text="comments.length"></span>)</h3>

                            <!-- Add Comment Form -->
                            <div class="card shadow-sm border-0 mb-4">
                                <div class="card-body p-4">
                                    <h5 class="card-title h6 fw-bold mb-3">Leave a Comment</h5>

                                    <template x-if="commentSuccess">
                                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                                            <span x-text="commentSuccess"></span>
                                            <button type="button" class="btn-close" @click="commentSuccess = null"></button>
                                        </div>
                                    </template>

                                    <template x-if="commentError">
                                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                            <span x-text="commentError"></span>
                                            <button type="button" class="btn-close" @click="commentError = null"></button>
                                        </div>
                                    </template>

                                    <form @submit.prevent="submitComment()">
                                        <div class="row g-3 mb-3">
                                            <div class="col-md-6">
                                                <label class="form-label small fw-bold">Name</label>
                                                <input type="text" class="form-control" x-model="commentForm.name" required placeholder="John Doe">
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label small fw-bold">Email</label>
                                                <input type="email" class="form-control" x-model="commentForm.email" required placeholder="john@example.com">
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label small fw-bold">Comment</label>
                                            <textarea class="form-control" rows="3" x-model="commentForm.body" required placeholder="Share your thoughts..."></textarea>
                                        </div>
                                        <button type="submit" class="btn btn-primary" :disabled="submittingComment">
                                            <span x-show="submittingComment" class="spinner-border spinner-border-sm me-1"></span>
                                            Submit Comment
                                        </button>
                                    </form>
                                </div>
                            </div>

                            <!-- Comments List -->
                            <div class="vstack gap-3">
                                <template x-for="comment in comments" :key="comment.id">
                                    <div class="p-3 bg-white rounded shadow-sm comment-item">
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <h6 class="fw-bold mb-0 text-dark" x-text="comment.name"></h6>
                                            <small class="text-muted" x-text="formatDate(comment.created)"></small>
                                        </div>
                                        <p class="mb-0 text-secondary" style="white-space: pre-line;" x-text="comment.body"></p>
                                    </div>
                                </template>

                                <template x-if="comments.length === 0">
                                    <p class="text-muted italic">No comments yet. Be the first to comment!</p>
                                </template>
                            </div>
                        </section>

                    </div>
                </template>

            </div>
        </div>
    </main>

    <!-- Share Post Modal -->
    <div class="modal fade" id="shareModal" tabindex="-1" aria-labelledby="shareModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="shareModalLabel">Share Post via Email</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <template x-if="shareSuccess">
                        <div class="alert alert-success" role="alert" x-text="shareSuccess"></div>
                    </template>
                    <template x-if="shareError">
                        <div class="alert alert-danger" role="alert" x-text="shareError"></div>
                    </template>

                    <form @submit.prevent="submitShare()">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Your Name</label>
                            <input type="text" class="form-control" x-model="shareForm.senderName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Your Email</label>
                            <input type="email" class="form-control" x-model="shareForm.senderEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Recipient Email</label>
                            <input type="email" class="form-control" x-model="shareForm.recipientEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Optional Comment</label>
                            <textarea class="form-control" rows="2" x-model="shareForm.comment"></textarea>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-primary" :disabled="submittingShare">
                                <span x-show="submittingShare" class="spinner-border spinner-border-sm me-1"></span>
                                Send Email
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
        <div class="container">
            Spring Boot Blog UI &copy; 2026
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function postDetail() {
            return {
                slug: null,
                post: null,
                similarPosts: [],
                comments: [],
                loading: true,
                error: null,
                
                commentForm: {
                    name: '',
                    email: '',
                    body: ''
                },
                submittingComment: false,
                commentSuccess: null,
                commentError: null,

                shareForm: {
                    senderName: '',
                    senderEmail: '',
                    recipientEmail: '',
                    comment: ''
                },
                submittingShare: false,
                shareSuccess: null,
                shareError: null,

                async init() {
                    this.slug = getQueryParam('slug');
                    if (!this.slug) {
                        this.error = 'No post slug specified in URL.';
                        this.loading = false;
                        return;
                    }
                    await this.loadPost();
                },

                async loadPost() {
                    this.loading = true;
                    this.error = null;
                    try {
                        const postRes = await fetch(`${API_BASE}/api/posts/${encodeURIComponent(this.slug)}`);
                        if (!postRes.ok) throw new Error(`Post not found (${postRes.status})`);
                        this.post = await postRes.json();

                        await Promise.all([
                            this.loadSimilarPosts(),
                            this.loadComments()
                        ]);
                    } catch (err) {
                        this.error = err.message || 'Failed to load post';
                    } finally {
                        this.loading = false;
                    }
                },

                async loadSimilarPosts() {
                    try {
                        const res = await fetch(`${API_BASE}/api/posts/${encodeURIComponent(this.slug)}/similar`);
                        if (res.ok) {
                            this.similarPosts = await res.json();
                        }
                    } catch (e) {
                        console.error('Failed to load similar posts', e);
                    }
                },

                async loadComments() {
                    if (!this.post || !this.post.id) return;
                    try {
                        const res = await fetch(`${API_BASE}/api/posts/${this.post.id}/comments`);
                        if (res.ok) {
                            this.comments = await res.json();
                        }
                    } catch (e) {
                        console.error('Failed to load comments', e);
                    }
                },

                async submitComment() {
                    if (!this.post || !this.post.id) return;
                    this.submittingComment = true;
                    this.commentSuccess = null;
                    this.commentError = null;

                    try {
                        const res = await fetch(`${API_BASE}/api/posts/${this.post.id}/comments`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.commentForm)
                        });

                        if (!res.ok) {
                            const errData = await res.json().catch(() => ({}));
                            throw new Error(errData.message || `Failed to submit comment (${res.status})`);
                        }

                        const newComment = await res.json();
                        this.comments.unshift(newComment);
                        this.commentSuccess = 'Comment posted successfully!';
                        this.commentForm = { name: '', email: '', body: '' };
                    } catch (err) {
                        this.commentError = err.message || 'Error submitting comment';
                    } finally {
                        this.submittingComment = false;
                    }
                },

                async submitShare() {
                    if (!this.slug) return;
                    this.submittingShare = true;
                    this.shareSuccess = null;
                    this.shareError = null;

                    try {
                        const res = await fetch(`${API_BASE}/api/posts/${encodeURIComponent(this.slug)}/share`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.shareForm)
                        });

                        if (!res.ok) {
                            throw new Error(`Failed to share post (${res.status})`);
                        }

                        this.shareSuccess = 'Post shared successfully!';
                        this.shareForm = { senderName: '', senderEmail: '', recipientEmail: '', comment: '' };
                    } catch (err) {
                        this.shareError = err.message || 'Error sharing post';
                    } finally {
                        this.submittingShare = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
