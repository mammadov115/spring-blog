<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Blog - Sitemap Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body x-data="sitemapViewer()">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Spring Blog</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Posts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="search.html">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="rss.html">RSS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="sitemap.html">Sitemap</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <h1 class="h3 fw-bold mb-0">Sitemap Viewer</h1>
                    <a :href="sitemapUrl" target="_blank" class="btn btn-outline-primary btn-sm">
                        Open Sitemap XML
                    </a>
                </div>

                <!-- Error Alert -->
                <template x-if="error">
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong x-text="error"></strong>
                        <button type="button" class="btn-close" @click="error = null" aria-label="Close"></button>
                    </div>
                </template>

                <!-- Loading Spinner -->
                <div x-show="loading" class="spinner-container">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Fetching Sitemap...</span>
                    </div>
                </div>

                <!-- Sitemap Table -->
                <template x-if="!loading && urls.length > 0">
                    <div class="card shadow-sm border-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th scope="col">Location (loc)</th>
                                        <th scope="col">Last Modified (lastmod)</th>
                                        <th scope="col">Change Freq</th>
                                        <th scope="col">Priority</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="(u, idx) in urls" :key="idx">
                                        <tr>
                                            <td>
                                                <a :href="u.loc" target="_blank" class="text-decoration-none font-monospace small" x-text="u.loc"></a>
                                            </td>
                                            <td class="text-muted small" x-text="formatDate(u.lastmod) || u.lastmod || 'N/A'"></td>
                                            <td>
                                                <span class="badge bg-info text-dark" x-text="u.changefreq || 'N/A'"></span>
                                            </td>
                                            <td class="fw-bold" x-text="u.priority || 'N/A'"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </template>

                <!-- Empty State -->
                <template x-if="!loading && urls.length === 0 && !error">
                    <div class="text-center py-5 bg-white rounded shadow-sm">
                        <p class="text-muted fs-5 mb-0">No entries found in sitemap.</p>
                    </div>
                </template>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
        <div class="container">
            Spring Boot Blog UI &copy; 2026
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function sitemapViewer() {
            return {
                sitemapUrl: `${API_BASE}/sitemap.xml`,
                urls: [],
                loading: true,
                error: null,

                async init() {
                    await this.fetchSitemap();
                },

                async fetchSitemap() {
                    this.loading = true;
                    this.error = null;
                    try {
                        const res = await fetch(this.sitemapUrl);
                        if (!res.ok) {
                            throw new Error(`Failed to fetch sitemap XML (${res.status})`);
                        }
                        const xmlText = await res.text();
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

                        if (xmlDoc.getElementsByTagName('parsererror').length > 0) {
                            throw new Error('Failed to parse XML response');
                        }

                        const urlNodes = xmlDoc.querySelectorAll('url');
                        const parsedUrls = [];
                        urlNodes.forEach(node => {
                            parsedUrls.push({
                                loc: node.querySelector('loc')?.textContent || '',
                                lastmod: node.querySelector('lastmod')?.textContent || '',
                                changefreq: node.querySelector('changefreq')?.textContent || '',
                                priority: node.querySelector('priority')?.textContent || ''
                            });
                        });
                        this.urls = parsedUrls;
                    } catch (err) {
                        this.error = err.message || 'Error loading sitemap XML';
                    } finally {
                        this.loading = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
