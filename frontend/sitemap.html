<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Blog - Sitemap Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body x-data="sitemapViewer()">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg site-nav sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span class="brand-dot"></span>Spring Blog</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Posts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="search.html">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="rss.html">RSS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="sitemap.html">Sitemap</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                
                <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-2">
                    <div>
                        <p class="page-kicker">Discovery</p>
                        <h1 class="page-title">Sitemap</h1>
                    </div>
                    <a :href="sitemapUrl" target="_blank" class="btn btn-outline-primary btn-sm">
                        Open XML
                    </a>
                </div>

                <!-- Error Alert -->
                <template x-if="error">
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong x-text="error"></strong>
                        <button type="button" class="btn-close" @click="error = null" aria-label="Close"></button>
                    </div>
                </template>

                <!-- Loading Spinner -->
                <div x-show="loading" class="spinner-container">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Fetching Sitemap...</span>
                    </div>
                </div>

                <p class="text-muted small mb-3" x-show="!loading && !error && totalCount > 0">
                    Showing <strong x-text="urls.length"></strong> of
                    <strong x-text="totalCount.toLocaleString()"></strong> URLs
                    <span x-show="totalCount > urls.length"> (preview — open XML for the full file)</span>
                </p>

                <!-- Sitemap Table -->
                <template x-if="!loading && urls.length > 0">
                    <div class="card shadow-sm border-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th scope="col">Location</th>
                                        <th scope="col">Last modified</th>
                                        <th scope="col">Change freq</th>
                                        <th scope="col">Priority</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="(u, idx) in urls" :key="idx">
                                        <tr>
                                            <td>
                                                <a :href="u.loc" target="_blank" class="text-decoration-none font-monospace small" x-text="u.loc"></a>
                                            </td>
                                            <td class="text-muted small" x-text="formatDate(u.lastmod) || u.lastmod || 'N/A'"></td>
                                            <td>
                                                <span class="badge bg-info text-dark" x-text="u.changefreq || 'N/A'"></span>
                                            </td>
                                            <td class="fw-bold" x-text="u.priority || 'N/A'"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </template>

                <!-- Empty State -->
                <template x-if="!loading && urls.length === 0 && !error">
                    <div class="empty-state">
                        <p class="fs-5 mb-0">No entries found in sitemap.</p>
                    </div>
                </template>

            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">Spring Blog &copy; 2026</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function sitemapViewer() {
            return {
                sitemapUrl: `${API_BASE}/sitemap.xml`,
                urls: [],
                totalCount: 0,
                displayLimit: 50,
                loading: true,
                error: null,

                async init() {
                    await this.fetchSitemap();
                },

                xmlTagText(block, tag) {
                    const match = block.match(new RegExp(`<${tag}[^>]*>([\\s\\S]*?)</${tag}>`, 'i'));
                    return match ? match[1].trim() : '';
                },

                async fetchSitemap() {
                    this.loading = true;
                    this.error = null;
                    try {
                        const xmlText = await fetchText(this.sitemapUrl);
                        if (looksLikeHtml(xmlText)) {
                            throw new Error('Got an HTML page instead of XML. Nginx is not proxying /sitemap.xml to the API.');
                        }

                        this.totalCount = (xmlText.match(/<url>/g) || []).length;
                        const parsed = [];
                        const re = /<url\b[^>]*>[\s\S]*?<\/url>/g;
                        let match;
                        while (parsed.length < this.displayLimit && (match = re.exec(xmlText))) {
                            parsed.push({
                                loc: this.xmlTagText(match[0], 'loc'),
                                lastmod: this.xmlTagText(match[0], 'lastmod'),
                                changefreq: this.xmlTagText(match[0], 'changefreq'),
                                priority: this.xmlTagText(match[0], 'priority')
                            });
                        }
                        this.urls = parsed;
                    } catch (err) {
                        this.error = err.message || 'Error loading sitemap XML';
                    } finally {
                        this.loading = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
