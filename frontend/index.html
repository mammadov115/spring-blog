<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Blog - Latest Posts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body x-data="postList()">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Spring Blog</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Posts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="search.html">Search</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 fw-bold mb-0" x-text="activeTag ? 'Posts Tagged: #' + activeTag : 'Latest Posts'">Latest Posts</h1>
                    <template x-if="activeTag">
                        <button class="btn btn-outline-secondary btn-sm" @click="clearTagFilter()">Clear Filter</button>
                    </template>
                </div>

                <!-- Error Message -->
                <template x-if="error">
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong x-text="error"></strong>
                        <button type="button" class="btn-close" @click="error = null" aria-label="Close"></button>
                    </div>
                </template>

                <!-- Post List -->
                <div class="vstack gap-3">
                    <template x-for="post in posts" :key="post.id">
                        <div class="card post-card shadow-sm border-0">
                            <div class="card-body p-4">
                                <h2 class="h4 card-title mb-2">
                                    <a :href="'post.html?slug=' + post.slug" class="text-decoration-none text-dark fw-bold" x-text="post.title"></a>
                                </h2>
                                
                                <div class="text-muted small mb-3 d-flex flex-wrap align-items-center gap-3">
                                    <span><i class="bi bi-person"></i> By <strong x-text="post.authorName || 'Anonymous'"></strong></span>
                                    <span>•</span>
                                    <span x-text="formatDate(post.publish)"></span>
                                </div>

                                <p class="card-text text-secondary mb-3" x-text="truncateText(post.body, 150)"></p>

                                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                                    <div class="d-flex flex-wrap gap-1">
                                        <template x-for="tag in post.tags" :key="tag">
                                            <a :href="'index.html?tag=' + encodeURIComponent(tag)" class="badge bg-secondary text-decoration-none tag-badge" x-text="'#' + tag"></a>
                                        </template>
                                    </div>
                                    <a :href="'post.html?slug=' + post.slug" class="btn btn-sm btn-outline-primary">Read More &rarr;</a>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Empty State -->
                <template x-if="!loading && posts.length === 0 && !error">
                    <div class="text-center py-5">
                        <p class="text-muted fs-5">No posts found.</p>
                    </div>
                </template>

                <!-- Loading Spinner -->
                <div x-show="loading" class="spinner-container">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <!-- Load More Button -->
                <div class="text-center mt-4" x-show="hasNext && !loading">
                    <button class="btn btn-primary px-4 py-2" @click="loadMore()">Load More</button>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
        <div class="container">
            Spring Boot Blog UI &copy; 2026
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function postList() {
            return {
                posts: [],
                nextCursor: null,
                hasNext: false,
                loading: false,
                error: null,
                activeTag: null,
                
                async init() {
                    this.activeTag = getQueryParam('tag');
                    if (this.activeTag) {
                        await this.fetchPostsByTag(this.activeTag);
                    } else {
                        await this.fetchPosts();
                    }
                },
                
                async fetchPosts() {
                    this.loading = true;
                    this.error = null;
                    try {
                        let url = `${API_BASE}/api/posts/keyset?size=10`;
                        if (this.nextCursor !== null && this.nextCursor !== undefined) {
                            url += `&cursor=${this.nextCursor}`;
                        }
                        const response = await fetch(url);
                        if (!response.ok) {
                            throw new Error(`Failed to load posts (${response.status})`);
                        }
                        const data = await response.json();
                        this.posts = [...this.posts, ...(data.content || [])];
                        this.hasNext = !!data.hasNext;
                        this.nextCursor = data.nextCursor !== undefined ? data.nextCursor : null;
                    } catch (err) {
                        this.error = err.message || 'Error fetching posts';
                    } finally {
                        this.loading = false;
                    }
                },
                
                async fetchPostsByTag(tagName) {
                    this.loading = true;
                    this.error = null;
                    try {
                        const response = await fetch(`${API_BASE}/api/tags/${encodeURIComponent(tagName)}/posts`);
                        if (!response.ok) {
                            throw new Error(`Failed to load posts for tag "${tagName}" (${response.status})`);
                        }
                        const data = await response.json();
                        this.posts = data || [];
                        this.hasNext = false;
                        this.nextCursor = null;
                    } catch (err) {
                        this.error = err.message || 'Error fetching posts by tag';
                    } finally {
                        this.loading = false;
                    }
                },

                loadMore() {
                    if (this.hasNext && !this.loading) {
                        this.fetchPosts();
                    }
                },

                clearTagFilter() {
                    window.location.href = 'index.html';
                }
            };
        }
    </script>
</body>
</html>
