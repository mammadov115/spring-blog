<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Blog - RSS Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body x-data="rssViewer()">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg site-nav sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span class="brand-dot"></span>Spring Blog</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Posts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="search.html">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="rss.html">RSS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sitemap.html">Sitemap</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                
                <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-2">
                    <div>
                        <p class="page-kicker">Syndication</p>
                        <h1 class="page-title">RSS feed</h1>
                    </div>
                    <a :href="rssUrl" target="_blank" class="btn btn-outline-primary btn-sm">
                        Open XML
                    </a>
                </div>

                <!-- Error Alert -->
                <template x-if="error">
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong x-text="error"></strong>
                        <button type="button" class="btn-close" @click="error = null" aria-label="Close"></button>
                    </div>
                </template>

                <!-- Loading Spinner -->
                <div x-show="loading" class="spinner-container">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Fetching RSS Feed...</span>
                    </div>
                </div>

                <!-- Channel Info & Feed Items -->
                <template x-if="!loading && channel">
                    <div class="mb-4">
                        <div class="card shadow-sm border-0 mb-4 feed-meta">
                            <div class="card-body p-4">
                                <h2 class="h4 fw-bold text-dark mb-1" x-text="channel.title"></h2>
                                <p class="text-muted mb-2" x-text="channel.description"></p>
                                <a :href="channel.link" target="_blank" class="small text-decoration-none" x-text="channel.link"></a>
                            </div>
                        </div>

                        <h3 class="h5 fw-bold mb-3">Feed Items (<span x-text="items.length"></span>)</h3>

                        <div class="vstack gap-3">
                            <template x-for="(item, idx) in items" :key="idx">
                                <div class="card shadow-sm border-0 post-card">
                                    <div class="card-body p-4">
                                        <h4 class="h5 card-title mb-2">
                                            <a :href="item.link" target="_blank" class="text-decoration-none text-dark fw-bold" x-text="item.title"></a>
                                        </h4>
                                        
                                        <div class="text-muted small mb-3" x-show="item.pubDate">
                                            <span>Published: </span><strong x-text="formatDate(item.pubDate)"></strong>
                                        </div>

                                        <div class="card-text text-secondary" style="white-space: pre-line;" x-text="item.description"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Empty State -->
                <template x-if="!loading && items.length === 0 && !error">
                    <div class="empty-state">
                        <p class="fs-5 mb-0">No items found in RSS feed.</p>
                    </div>
                </template>

            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">Spring Blog &copy; 2026</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function rssViewer() {
            return {
                rssUrl: `${API_BASE}/feed/rss`,
                channel: null,
                items: [],
                loading: true,
                error: null,

                async init() {
                    await this.fetchRss();
                },

                async fetchRss() {
                    this.loading = true;
                    this.error = null;
                    try {
                        const xmlDoc = await fetchXml(this.rssUrl);
                        const channelNode = xmlDescendants(xmlDoc, 'channel')[0];
                        if (channelNode) {
                            this.channel = {
                                title: xmlChildText(channelNode, 'title') || 'RSS Feed',
                                description: xmlChildText(channelNode, 'description'),
                                link: xmlChildText(channelNode, 'link')
                            };
                        }

                        this.items = xmlDescendants(xmlDoc, 'item').map((node) => ({
                            title: xmlChildText(node, 'title') || 'Untitled',
                            link: xmlChildText(node, 'link') || '#',
                            description: xmlChildText(node, 'description'),
                            pubDate: xmlChildText(node, 'pubDate')
                        }));
                    } catch (err) {
                        this.error = err.message || 'Error loading RSS feed';
                    } finally {
                        this.loading = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
