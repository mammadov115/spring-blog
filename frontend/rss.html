<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Blog - RSS Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body x-data="rssViewer()">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Spring Blog</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Posts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="search.html">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="rss.html">RSS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sitemap.html">Sitemap</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <h1 class="h3 fw-bold mb-0">RSS Feed Viewer</h1>
                    <a :href="rssUrl" target="_blank" class="btn btn-outline-primary btn-sm">
                        Open RSS Feed (XML)
                    </a>
                </div>

                <!-- Error Alert -->
                <template x-if="error">
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong x-text="error"></strong>
                        <button type="button" class="btn-close" @click="error = null" aria-label="Close"></button>
                    </div>
                </template>

                <!-- Loading Spinner -->
                <div x-show="loading" class="spinner-container">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Fetching RSS Feed...</span>
                    </div>
                </div>

                <!-- Channel Info & Feed Items -->
                <template x-if="!loading && channel">
                    <div class="mb-4">
                        <div class="card shadow-sm border-0 mb-4 bg-light">
                            <div class="card-body p-4">
                                <h2 class="h4 fw-bold text-dark mb-1" x-text="channel.title"></h2>
                                <p class="text-muted mb-2" x-text="channel.description"></p>
                                <a :href="channel.link" target="_blank" class="small text-decoration-none" x-text="channel.link"></a>
                            </div>
                        </div>

                        <h3 class="h5 fw-bold mb-3">Feed Items (<span x-text="items.length"></span>)</h3>

                        <div class="vstack gap-3">
                            <template x-for="(item, idx) in items" :key="idx">
                                <div class="card shadow-sm border-0 post-card">
                                    <div class="card-body p-4">
                                        <h4 class="h5 card-title mb-2">
                                            <a :href="item.link" target="_blank" class="text-decoration-none text-dark fw-bold" x-text="item.title"></a>
                                        </h4>
                                        
                                        <div class="text-muted small mb-3" x-show="item.pubDate">
                                            <span>Published: </span><strong x-text="formatDate(item.pubDate)"></strong>
                                        </div>

                                        <div class="card-text text-secondary" style="white-space: pre-line;" x-text="item.description"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Empty State -->
                <template x-if="!loading && items.length === 0 && !error">
                    <div class="text-center py-5 bg-white rounded shadow-sm">
                        <p class="text-muted fs-5 mb-0">No items found in RSS feed.</p>
                    </div>
                </template>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
        <div class="container">
            Spring Boot Blog UI &copy; 2026
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function rssViewer() {
            return {
                rssUrl: `${API_BASE}/feed/rss`,
                channel: null,
                items: [],
                loading: true,
                error: null,

                async init() {
                    await this.fetchRss();
                },

                async fetchRss() {
                    this.loading = true;
                    this.error = null;
                    try {
                        const res = await fetch(this.rssUrl);
                        if (!res.ok) {
                            throw new Error(`Failed to fetch RSS feed (${res.status})`);
                        }
                        const xmlText = await res.text();
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

                        // Parse parsererror
                        if (xmlDoc.getElementsByTagName('parsererror').length > 0) {
                            throw new Error('Failed to parse XML response');
                        }

                        const channelNode = xmlDoc.querySelector('channel');
                        if (channelNode) {
                            this.channel = {
                                title: channelNode.querySelector('title')?.textContent || 'RSS Feed',
                                description: channelNode.querySelector('description')?.textContent || '',
                                link: channelNode.querySelector('link')?.textContent || ''
                            };
                        }

                        const itemNodes = xmlDoc.querySelectorAll('item');
                        const parsedItems = [];
                        itemNodes.forEach(node => {
                            parsedItems.push({
                                title: node.querySelector('title')?.textContent || 'Untitled',
                                link: node.querySelector('link')?.textContent || '#',
                                description: node.querySelector('description')?.textContent || '',
                                pubDate: node.querySelector('pubDate')?.textContent || ''
                            });
                        });
                        this.items = parsedItems;
                    } catch (err) {
                        this.error = err.message || 'Error loading RSS feed';
                    } finally {
                        this.loading = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
